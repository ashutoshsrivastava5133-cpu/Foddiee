<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Foodie Express</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .not-found { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; gap:20px; }
    .nf-emoji { font-size:5rem; animation:float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .nf-code { font-size:6rem; font-weight:800; font-family:var(--font-display); background:linear-gradient(135deg,var(--orange),var(--coral)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
    .nf-title { font-family:var(--font-display); font-size:1.6rem; font-weight:800; }
    .nf-desc { color:var(--text-secondary); max-width:380px; }
  </style>
</head>
<body>
<div id="toast-container"></div>
<div class="not-found">
  <div class="nf-emoji">🍔</div>
  <div class="nf-code">404</div>
  <div class="nf-title">Oops! Page Not Found</div>
  <p class="nf-desc">Looks like this page went out for delivery and got lost. Let's get you back to something delicious!</p>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <a href="index.html" class="btn btn-primary btn-lg">🏠 Go Home</a>
    <a href="restaurants.html" class="btn btn-outline btn-lg">🍽️ Browse Restaurants</a>
  </div>
  <button class="theme-toggle" style="margin-top:16px;width:40px;height:40px;border-radius:50%;background:var(--bg-secondary);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer">🌙</button>
</div>
<script src="js/app.js"></script>
</body>
</html>
